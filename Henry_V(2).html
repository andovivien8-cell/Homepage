<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Henry V - William Shakespeare</title>
<link rel="stylesheet" href="style2.css">
</head>

<body>

<!-- Progress Bar -->
<div id="progressBar"></div>

<!-- Dark Mode Toggle -->
<button id="themeToggle">🌙 Theatre Mode</button>

<!-- Layout Wrapper -->
<div class="layout">

    <!-- Sticky Table of Contents -->
    <nav class="toc">
        <h3>Acts</h3>
        <ul>
            <li><a href="#act1">ACT I</a></li>
            <li><a href="#act2">ACT II</a></li>
            <li><a href="#act3">ACT III</a></li>
            <li><a href="#act4">ACT IV</a></li>
            <li><a href="#act5">ACT V</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h1>Henry V</h1>
        <h2>A Shakespeare Play</h2>

        <div id="play">Loading play...</div>
    </div>

</div>

<button id="backToTop" onclick="scrollToTop()">↑</button>

<script>
/* ================= LOAD TEXT ================= */
fetch("henryv.txt")
.then(response => response.text())
.then(text => {

   const formatted = text
        .replace(/ACT\s+1/gi, "<h2 id='act1'>ACT 1</h2>")
        .replace(/ACT\s+2/gi, "<h2 id='act2'>ACT 2</h2>")
        .replace(/ACT\s+3/gi, "<h2 id='act3'>ACT 3</h2>")
        .replace(/ACT\s+4/gi, "<h2 id='act4'>ACT 4</h2>")
        .replace(/ACT\s+5/gi, "<h2 id='act5'>ACT 5</h2>");

    document.getElementById("play").innerHTML = formatted;
});

/* ================= SCROLL TO TOP ================= */
function scrollToTop() {
    window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================= PROGRESS BAR ================= */
window.addEventListener("scroll", () => {
    const scrollTop = document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const progress = (scrollTop / height) * 100;
    document.getElementById("progressBar").style.width = progress + "%";
});

/* ================= BACK TO TOP BUTTON ================= */
const backBtn = document.getElementById("backToTop");

window.addEventListener("scroll", function () {
    if (window.scrollY > 400) {
        backBtn.style.display = "block";
    } else {
        backBtn.style.display = "none";
    }
});

/* ================= ACT HIGHLIGHT ================= */
const sections = ["act1","act2","act3","act4","act5"];
const links = document.querySelectorAll(".toc a");

window.addEventListener("scroll", () => {
    let current = "";

    sections.forEach(id => {
        const section = document.getElementById(id);
        if (section) {
            const sectionTop = section.offsetTop - 100;
            if (window.scrollY >= sectionTop) {
                current = id;
            }
        }
    });

    links.forEach(link => {
        link.classList.remove("active");
        if (link.getAttribute("href") === "#" + current) {
            link.classList.add("active");
        }
    });
});

/* ================= DARK MODE ================= */
const toggle = document.getElementById("themeToggle");

toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        toggle.textContent = "☀ Light Mode";
    } else {
        toggle.textContent = "🌙 Theatre Mode";
    }
});
</script>

</body>
</html>
