<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Henry V - William Shakespeare</title>
        <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
      <!-- Navigation Buttons -->
       <div class="nav-buttons">
           <button  onclick="scrollToTop()">
            Top
           </button>
           <button  onclick="scrollToMiddle()">
            Middle
           </button>
           <button  onclick="scrollToBottom()">
            Bottom
           </button>
       </div>
       
        <div class="container">
        <h1 id="top">Henry V</h1>
        <h2>A Shakespeare Play</h2>

        <div id="play">
            Loading play...
        </div>

        <!-- Invisible bottom anchor -->
        <div id="bottom"></div>
        
    </div>

   <!-- Floating back to top button -->
   <button id="backToTop" onclick="scrollToTop()">↑</button>
   
    <script>
        // Load the play text
    fetch("henryv.txt")
        .then(response => response.text())
        .then(text => {
            document.getElementById("play").textContent = text;
        })
        .catch(error => {
            document.getElementById("play").textContent =
                "Unable to load the play.";
        });

    // Navigation functions
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function scrollToBottom() {
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    }

    function scrollToMiddle() {
        window.scrollTo({
            top: document.body.scrollHeight / 2,
            behavior: "smooth"
        });
    }
        
    // Show / hide arrow on scroll
        const backBtn = document.getElementById("backToTop");

        window.addEventListener("scroll", function () {
            if (window.scrollY > 300) {
                backBtn.style.display = "block";
            } else {
                backBtn.style.display = "none";
            }
        });

    </script>
    </body>
</html>
